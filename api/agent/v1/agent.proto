syntax = "proto3";
package webscan.agent.v1;
option go_package = "webscan/sdk/agent/v1;agentv1";

// Only collectors call this service. User clients query the control plane.
service AgentService {
  rpc Capabilities(CapabilitiesRequest) returns (CapabilitiesResponse);
  rpc FetchEvents(FetchEventsRequest) returns (EventBatch);
  rpc AckEvents(AckEventsRequest) returns (AckEventsResponse);
  rpc ReadMetrics(ReadMetricsRequest) returns (MetricsBatch);
  // Read-only DR inventory and retained-event replay; never advances epoch.
  rpc RecoveryState(RecoveryStateRequest) returns (RecoveryStateResponse);
  rpc ReadRecoveryEvents(ReadRecoveryEventsRequest) returns (RecoveryEventsBatch);
  // Additive, optional capability. Only a full snapshot signed by the pinned
  // CA can advance trust; it cannot change identities or configuration.
  rpc UpdateTrust(UpdateTrustRequest) returns (UpdateTrustResponse);
  // Refreshes CRLs only within an administrator-installed root rotation.
  // Cannot install a new CA or remove an existing CA.
  rpc RefreshRootTrust(RefreshRootTrustRequest) returns (RefreshRootTrustResponse);
  // Optional managed identity lifecycle. The node generates and retains its
  // replacement private key; only public CSR/certificate bytes cross the wire.
  rpc PrepareIdentityRenewal(PrepareIdentityRenewalRequest) returns (PreparedIdentityRenewal);
  rpc ActivateIdentityRenewal(ActivateIdentityRenewalRequest) returns (ActivatedIdentityRenewal);
}
message CapabilitiesRequest {}
message CapabilitiesResponse {
  string node_id = 1;
  string version = 2;
  uint32 protocol = 3;
  uint32 max_events = 4;
  uint32 max_bytes = 5;
  // Zero/empty identifies an older Agent without config acknowledgements.
  int64 configuration_version = 6;
  string configuration_sha256 = 7;
  bool identity_renewal = 8;
  string certificate_sha256 = 9;
  int64 certificate_not_after_unix = 10;
  bool root_trust_refresh = 11;
  bool recovery_read = 12;
}
message FetchEventsRequest {
  uint64 epoch = 1;
  uint32 limit = 2;
  uint32 wait_seconds = 3;
}
message Event {
  string id = 1;
  bytes json = 2;
}
message EventBatch {
  string node_id = 1;
  string receipt = 2;
  repeated Event events = 3;
}
message Rejection {
  string id = 1;
  string code = 2;
}
message AckEventsRequest {
  uint64 epoch = 1;
  string receipt = 2;
  repeated string accepted = 3;
  repeated Rejection rejected = 4;
}
message AckEventsResponse { uint32 confirmed = 1; }
message ReadMetricsRequest { int64 after_unix_millis = 1; }
message MetricsSample {
  int64 unix_millis = 1;
  bytes prometheus_text = 2;
}
message MetricsBatch {
  string node_id = 1;
  repeated MetricsSample samples = 2;
}
message UpdateTrustRequest {
  string node_id = 1;
  bytes crl = 2;
}
message UpdateTrustResponse {
  string node_id = 1;
  string crl_sha256 = 2;
  string crl_number = 3;
  int64 next_update_unix = 4;
}
message PrepareIdentityRenewalRequest {
  string node_id = 1;
  string certificate_sha256 = 2;
}
message PreparedIdentityRenewal {
  string node_id = 1;
  string certificate_sha256 = 2;
  string request_sha256 = 3;
  bytes public_request_json = 4;
}
message ActivateIdentityRenewalRequest {
  string node_id = 1;
  string previous_certificate_sha256 = 2;
  string request_sha256 = 3;
  bytes certificate = 4;
}
message ActivatedIdentityRenewal {
  string node_id = 1;
  string request_sha256 = 2;
  string certificate_sha256 = 3;
  int64 certificate_not_after_unix = 4;
}

message RefreshRootTrustRequest {
  string node_id = 1;
  bytes snapshot_json = 2;
}
message RefreshRootTrustResponse {
  string node_id = 1;
  string snapshot_sha256 = 2;
  string rotation = 3;
  string phase = 4;
}

message RecoveryStateRequest { string node_id = 1; }
message RecoveryStateResponse {
 string node_id = 1;
 uint64 epoch = 2;
 int64 configuration_version = 3;
 string configuration_sha256 = 4;
 string snapshot_sha256 = 5;
 string cursor = 6;
 int64 retained_events = 7;
 int64 accepted_events = 8;
 int64 pending_events = 9;
 int64 earliest_created_unix_millis = 10;
 int64 latest_created_unix_millis = 11;
 int64 earliest_metrics_unix_millis = 12;
 int64 latest_metrics_unix_millis = 13;
 // False when historical deletion watermarks cannot prove completeness.
 bool retention_complete = 14;
 string retention_reason = 15;
 int64 retention_since_unix_millis = 16;
 int64 last_deleted_unix_millis = 17;
 int64 deleted_events = 18;
}
message ReadRecoveryEventsRequest {
 string node_id = 1;
 string cursor = 2;
 uint32 limit = 3;
}
message RecoveryEvent {
 string id = 1;
 bytes json = 2;
 int64 created_unix_millis = 3;
 bool accepted = 4;
 int64 accepted_unix_millis = 5;
}
message RecoveryEventsBatch {
 string node_id = 1;
 string snapshot_sha256 = 2;
 uint64 epoch = 3;
 string next_cursor = 4;
 repeated RecoveryEvent events = 5;
 bool complete = 6;
 int64 read_events = 7;
}
